name: security-ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install commitlint deps
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Validate commits
        run: |
          pnpm exec commitlint \
            --config commitlint.config.cjs \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
        working-directory: frontend

  branch-name:
    name: Branch name convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Validating branch: $BRANCH"
          if echo "$BRANCH" | grep -Eq '^(release|hotfix)/[a-z0-9._-]+$'; then
            exit 0
          fi
          if echo "$BRANCH" | grep -Eq '^(feat|fix|chore|docs|refactor|test|perf|ci|build|revert|style)/[a-z0-9][a-z0-9-]*$'; then
            exit 0
          fi
          echo "::error::Branch name '$BRANCH' does not follow convention."
          echo "Expected: <type>/<kebab-description>"
          echo "Types: feat, fix, chore, docs, refactor, test, perf, ci, build, revert, style"
          echo "Or: release/<name>, hotfix/<name>"
          exit 1
